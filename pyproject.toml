[project]
name = "hardware-database-cli"
version = "0.1.0"
description = "Standalone CLI + MCP client for Hardware DataBase API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.28.1",
]

[project.scripts]
hardware-database = "src.cli.main:main"
hardware-database-mcp = "src.mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
